[project]
name = "gakusai-pos"
version = "0.1.0"
description = "学祭飲食模擬店向けPOS・KDS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.143.0",
    "jinja2>=3.1.6",
    "qrcode[pil]>=8.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
gakusai-pos = "gakusai_pos.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gakusai_pos"]

# ホームの pyproject.toml のワークスペースに取り込まれないよう独立させる
[tool.uv]
# OneDrive上ではハードリンクが使えないためコピーで入れる
link-mode = "copy"

[tool.uv.workspace]
members = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# B008: FastAPIの Depends() は引数の既定値に書くのが流儀
# DTZ005: 学祭会場の現地時刻（タイムゾーンなし）で記録する方針
# BLE001/S110: 営業を止めないため、バックアップ・音声などの失敗は意図的に握りつぶす
extend-ignore = ["B008", "DTZ005", "BLE001", "S110"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
